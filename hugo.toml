baseURL = 'https://rcapitao.github.io/rcapitao-v2/'
defaultContentLanguage = 'pt-br'
title = 'Rafael Capitão'

enableRobotsTXT = true

[outputFormats.rss]
  baseName = 'feed'

[params]
  description = 'Rafael Capitão'
  author = 'Rafael Capitão'
  homeTitle = 'Rafael Capitão'
  homeImage = '/images/profile.jpg'
  ogImage = '/images/profile.jpg'
  favicon = '/images/favicon.png'
  homeSubtitle = 'Advogado | Compliance, Privacidade e Proteção de Dados'
  homeBio = 'Regulamentação e melhores práticas para a segurança da informação e a privacidade no ambiente digital'
  recentPostsCount = 3

  [[params.socialLinks]]
    name = 'GitHub'
    url = 'https://github.com/rcapitao'
    external = true
  [[params.socialLinks]]
    name = 'Blog'
    url = '/posts/'

[menu]
  [[menu.main]]
    name = 'Sobre'
    url = '/sobre/'
    weight = 1
  [[menu.main]]
    name = 'Agora'
    url = '/agora/'
    weight = 2
  [[menu.main]]
    name = 'Blog'
    url = '/posts/'
    weight = 3

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = 'tags'
    weight = 100
  [[related.indices]]
    name = 'date'
    weight = 10

[minify]
  disableXML = true
