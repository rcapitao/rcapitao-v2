baseURL = 'https://rcapitao.github.io/rcapitao-v2/'
defaultContentLanguage = 'pt-br'
title = 'rcapitao'
theme = 'hugo-ink'

enableRobotsTXT = true

[params]
  description = 'rcapitao'
  author = 'rcapitao'
  homeTitle = 'rcapitao'
  homeSubtitle = 'rcapitao'
  homeBio = ''
  recentPostsCount = 3

  [[params.socialLinks]]
    name = 'GitHub'
    url = 'https://github.com/rcapitao'
    external = true
  [[params.socialLinks]]
    name = 'Blog'
    url = '/posts/'

[menu]
  [[menu.main]]
    name = 'Sobre'
    url = '/sobre/'
    weight = 1
  [[menu.main]]
    name = 'Agora'
    url = '/agora/'
    weight = 2
  [[menu.main]]
    name = 'Blog'
    url = '/posts/'
    weight = 3

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[minify]
  disableXML = true
