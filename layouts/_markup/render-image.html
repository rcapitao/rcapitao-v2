{{- $src := .Destination -}}
{{- $width := 0 -}}
{{- $height := 0 -}}
{{- if hasPrefix $src "/" -}}
  {{- $relPath := strings.TrimPrefix "/" $src -}}
  {{- $src = $relPath | relURL -}}
  {{- with resources.Get $relPath -}}
    {{- $width = .Width -}}
    {{- $height = .Height -}}
  {{- end -}}
{{- end -}}
<img src="{{ $src | safeURL }}" alt="{{ .Text }}" {{ with .Title }}title="{{ . }}"{{ end }} {{ if $width }}width="{{ $width }}" height="{{ $height }}"{{ end }} loading="lazy">
