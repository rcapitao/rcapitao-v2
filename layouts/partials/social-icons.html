{{- range site.Params.socialLinks }}
{{- $icon := resources.Get (printf "icon/%s.svg" (lower .name)) }}
<a href="{{ strings.TrimPrefix "/" .url | relURL }}" {{ if .external }}target="_blank" rel="noopener noreferrer"{{ end }} aria-label="{{ .name }}" title="{{ .name }}">
  {{- if $icon }}{{ $icon.Content | safeHTML }}{{ else }}{{ .name }}{{ end -}}
</a>
{{- end }}
